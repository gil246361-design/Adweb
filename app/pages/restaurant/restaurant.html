@if (restaurant(); as r) {
  <div class="restaurant-page">
    <div class="banner">
      <img class="banner-image" [src]="r.image" [alt]="r.name" />
      <button class="back-button" (click)="goBack()" aria-label="กลับหน้าหลัก">←</button>
    </div>

    <div class="content">
      <h1 class="restaurant-name">{{ r.name }}</h1>
      <p class="restaurant-description">{{ r.description }}</p>
      <div class="tags">
        @for (tag of r.tags; track tag) {
          <span class="tag-chip">{{ tag }}</span>
        }
      </div>

      <h2 class="section-title">เมนู</h2>
      <div class="menu-list">
        @for (item of r.menu; track item.id) {
          <div class="menu-row" (click)="openReview(item.id)">
            <img class="menu-image" [src]="item.image" [alt]="item.name" />
            <div class="menu-info">
              <span class="menu-name">{{ item.name }}</span>
              <span class="menu-price">{{ item.price }} บาท</span>
            </div>
            <button
              class="favorite-button"
              [class.active]="isFavorite(item.id)"
              (click)="toggleFavorite(item.id, $event)"
              aria-label="บันทึกอาหารที่ชอบ"
            >
              ♥
            </button>
            <span class="rating-chip">★ {{ item.rating.toFixed(1) }}</span>
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <div class="not-found">
    <p>ไม่พบร้านอาหารนี้</p>
    <button (click)="goBack()">กลับหน้าหลัก</button>
  </div>
}
